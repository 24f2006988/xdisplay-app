[package]
name = "xdisplay-client-native"
version = "1.0.1"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xdisplay-common = { path = "../../common" }
jni = "0.21"
anyhow = "1.0"
tracing = "0.1"
log = "0.4"
bincode = "1.3"
byteorder = "1.5"
bytemuck = "1.16"

[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.8"
ndk-sys = "0.5"
libc = "0.2"
android_logger = "0.13"

[workspace]

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
