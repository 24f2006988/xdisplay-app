# Project-wide Gradle settings.

# Enable AndroidX for modern Android libraries
android.useAndroidX=true

# Enables namespacing for library R classes
android.nonTransitiveRClass=true

# Gradle memory optimization
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Builds need JDK 17: set JAVA_HOME (or org.gradle.java.home in your user-level gradle.properties).

# Kotlin compiler stability
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
kotlin.compiler.execution.strategy=in-process
